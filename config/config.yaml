ollama:
  model: llama3:8b-instruct-q4_0
  base_url: http://localhost:11434
  timeout_seconds: 120

drift:
  # Starting hypotheses - calibrate in Phase 3 against labeled pairs
  thresholds:
    cosmetic: 0.98
    intent_shift: 0.85

score:
  roles:
    - Client
    - Vendor
    - Licensor
    - Licensee
  categories:
    - Termination
    - Indemnity
    - LimitationOfLiability
    - Confidentiality
    - IntellectualProperty
    - Payment
    - GoverningLaw
    - Warranty
    - NonCompete
    - Assignment
    - Unclassified
  # role x category weights (1.0 = neutral). Higher = more risk for that role.
  weight_matrix:
    Client:
      Termination: 1.2
      Indemnity: 1.5
      LimitationOfLiability: 1.4
      Confidentiality: 1.0
      IntellectualProperty: 1.1
      Payment: 1.3
      GoverningLaw: 0.9
      Warranty: 1.2
      NonCompete: 1.1
      Assignment: 1.0
      Unclassified: 1.0
    Vendor:
      Termination: 1.3
      Indemnity: 1.4
      LimitationOfLiability: 1.1
      Confidentiality: 1.0
      IntellectualProperty: 1.3
      Payment: 0.9
      GoverningLaw: 0.9
      Warranty: 1.4
      NonCompete: 1.2
      Assignment: 1.1
      Unclassified: 1.0
    Licensor:
      Termination: 1.1
      Indemnity: 1.2
      LimitationOfLiability: 1.0
      Confidentiality: 1.1
      IntellectualProperty: 1.5
      Payment: 1.0
      GoverningLaw: 0.9
      Warranty: 1.1
      NonCompete: 1.0
      Assignment: 1.2
      Unclassified: 1.0
    Licensee:
      Termination: 1.3
      Indemnity: 1.4
      LimitationOfLiability: 1.3
      Confidentiality: 1.0
      IntellectualProperty: 1.4
      Payment: 1.2
      GoverningLaw: 0.9
      Warranty: 1.3
      NonCompete: 1.3
      Assignment: 1.0
      Unclassified: 1.0

parser:
  # Relative font-size ratio above median to treat a line as a heading
  heading_font_ratio: 1.15
  min_heading_confidence_ratio: 0.08

anonymize:
  model: en_core_web_sm
  labels:
    - PERSON
    - ORG
    - MONEY
    - GPE
    - DATE

paths:
  cache_dir: .cache
  debug_log: .cache/verify_rejects.log

llm:
  max_retries: 1
